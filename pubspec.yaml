name: airpick
description: "Airpick mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.0
  intl: ^0.20.2
  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  # Social sign-in
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.7
  # Networking
  dio: ^5.8.0
  # Realtime chat (STOMP over WebSocket / SockJS)
  stomp_dart_client: ^2.1.0
  # Secure storage
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.3
  image_picker: ^1.1.2
  package_info_plus: ^8.3.0
  veriff_flutter: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.3

# App icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo_me.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo_me.png
  min_sdk_android: 21

# Native splash (run: dart run flutter_native_splash:create)
flutter_native_splash:
  color: "#ffffff"
  color_dark: "#0F172A"
  image: assets/logo_me.png
  android_12:
    image: assets/logo_me.png
    color: "#ffffff"
    color_dark: "#0F172A"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/logo_me.png
    - assets/logo-white.png
    - assets/logo-long.png
    - assets/onboarding/community.png
    - assets/onboarding/second.png
    - assets/onboarding/trust3.png

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
